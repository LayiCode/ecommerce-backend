name: Uptime Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the Render backend
        run: curl -sS -o /dev/null -w "Ping HTTP %{http_code} in %{time_total}s\n" "https://ecommerce-backend-jdp8.onrender.com/api/products?page=0&size=1"
