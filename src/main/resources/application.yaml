server:
  port: 8080

spring:
  application:
    name: ecommerce-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:your_local_postgres_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-characters-long}
  expiration-ms: 86400000  # 24 hours

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:your_paystack_test_secret_key_here}
  base-url: "https://api.paystack.co"